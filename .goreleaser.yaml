version: 2
project_name: anti-tangent-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: anti-tangent-mcp
    main: ./cmd/anti-tangent-mcp
    binary: anti-tangent-mcp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# NOT disabled. GoReleaser loads --release-notes inside the changelog pipe
# (internal/pipe/changelog: Skip() returns Changelog.Disable, and Run() is what
# calls loadContent(ctx.ReleaseNotesFile)). With `disable: true` the pipe was
# skipped, the file the release workflow passes was never read, and every
# release from v0.11.0 to v0.18.1 published a bare-newline body.
#
# Disabling it here is also unnecessary: Run() returns early as soon as a notes
# file is supplied, so no git-log changelog is generated on top of ours.
changelog:
  use: git

release:
  github:
    owner: patiently
    name: anti-tangent-mcp
