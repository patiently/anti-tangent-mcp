name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['gnome-topbar/**']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: version
        run: |
          CURRENT=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          MSG=$(git log -1 --pretty=%B)

          if [[ "$MSG" == *"[major]"* ]]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [[ "$MSG" == *"[minor]"* ]]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping: $CURRENT -> $NEW"

      - name: Validate changelog
        run: |
          NEW="${{ steps.version.outputs.new_version }}"
          if ! grep -q "^## \[$NEW\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md must contain '## [$NEW]'"
            exit 1
          fi

  tag:
    name: Bump VERSION and tag
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update VERSION file
        run: |
          echo "${{ needs.version.outputs.new_version }}" > VERSION
          if git diff --quiet VERSION; then
            echo "VERSION already at ${{ needs.version.outputs.new_version }}; skipping commit"
          else
            git add VERSION
            git commit -m "chore: release v${{ needs.version.outputs.new_version }} [skip ci]"
            git push
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ needs.version.outputs.new_version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists on origin; skipping"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [version, tag]
    permissions:
      contents: write
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.new_version }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Write release notes
        env:
          NEW: ${{ needs.version.outputs.new_version }}
        run: |
          # Extract from CHANGELOG.md in THIS job's own checkout (it is checked
          # out at the release tag above). The notes used to be extracted in the
          # version job and handed over as a multiline job output; they arrived
          # empty, and v0.11.0 through v0.18.0 all shipped a 1-byte release body
          # while the workflow reported success. Only new_version crosses the job
          # boundary now — a short single-line value, demonstrably reliable since
          # the tag and VERSION bump were always correct.
          #
          # NEW comes in via env, not ${{ }} interpolation, so the value cannot be
          # spliced into this script.
          awk -v v="$NEW" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ { if (f) exit }
            f { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"

          BYTES=$(wc -c < "${RUNNER_TEMP}/release-notes.md")
          echo "release notes for ${NEW}: ${BYTES} bytes"
          head -5 "${RUNNER_TEMP}/release-notes.md"

          # Fail loudly rather than publish a blank release again. The old bug was
          # invisible precisely because nothing checked.
          if [ "$BYTES" -lt 20 ]; then
            echo "::error file=CHANGELOG.md::release notes for ${NEW} are empty (${BYTES} bytes) — refusing to publish a blank release body"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [version, tag, goreleaser]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v6
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.new_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/anti-tangent-mcp:${{ needs.version.outputs.new_version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/anti-tangent-mcp:latest
